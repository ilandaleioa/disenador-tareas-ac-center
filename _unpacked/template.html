<style>
  html, body { margin: 0; padding: 0; background: #07080a; font-family: 'Archivo', system-ui, sans-serif; }
  * { box-sizing: border-box; }
  a { color: #f0343c; }
  a:hover { color: #ff8090; }
  input, select, button { font-family: inherit; }
  select { appearance: none; }
</style>
</helmet>

<div ref="{{ appRef }}" style="display:flex; height:100vh; width:100%; background:#07080a; color:#f5f7fa; overflow:hidden; userSelect:none">

  <sc-if value="{{ newModalOpen }}" hint-placeholder-val="{{ false }}">
    <div sc-camel-on-click="{{ closeNewModal }}" style="position:fixed; inset:0; background:rgba(0,0,0,0.6); zIndex:500; display:flex; alignItems:center; justifyContent:center">
      <div sc-camel-on-click="{{ stopClick }}" style="width:380px; background:#14171c; border:1px solid #23262d; borderRadius:14px; padding:24px; boxShadow:0 24px 60px rgba(0,0,0,0.55); display:flex; flexDirection:column; gap:14px">
        <div style="fontSize:12px; fontWeight:800; letterSpacing:0.14em; color:#6b7482">NUEVO EJERCICIO</div>
        <input value="{{ newTitleDraft }}" sc-camel-on-change="{{ setNewTitleDraft }}" sc-camel-on-key-down="{{ stopClick }}" sc-camel-auto-focus="true" spellcheck="false" placeholder="Nombre del ejercicio" style="background:#0b0d10; border:1px solid #23262d; borderRadius:8px; padding:10px 12px; color:#fff; fontSize:16px; fontWeight:700; outline:none">
        <div style="display:flex; gap:10px; justifyContent:flex-end; marginTop:4px">
          <button sc-camel-on-click="{{ closeNewModal }}" style="padding:10px 16px; borderRadius:8px; border:1px solid #23262d; background:#1c2027; color:#e7ebf1; fontSize:12px; fontWeight:800; cursor:pointer">CANCELAR</button>
          <button sc-camel-on-click="{{ confirmNewExercise }}" style="padding:10px 16px; borderRadius:8px; border:none; background:#2563eb; color:#fff; fontSize:12px; fontWeight:800; cursor:pointer">CREAR</button>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ exportModalOpen }}" hint-placeholder-val="{{ false }}">
    <div sc-camel-on-click="{{ closeExportModal }}" style="position:fixed; inset:0; background:rgba(0,0,0,0.6); zIndex:500; display:flex; alignItems:center; justifyContent:center">
      <div sc-camel-on-click="{{ stopClick }}" style="width:380px; background:#14171c; border:1px solid #23262d; borderRadius:14px; padding:24px; boxShadow:0 24px 60px rgba(0,0,0,0.55); display:flex; flexDirection:column; gap:14px">
        <div style="fontSize:12px; fontWeight:800; letterSpacing:0.14em; color:#6b7482">GUARDAR EJERCICIOS</div>
        <input value="{{ exportNameDraft }}" sc-camel-on-change="{{ setExportNameDraft }}" sc-camel-on-key-down="{{ stopClick }}" sc-camel-auto-focus="true" spellcheck="false" placeholder="Nombre del archivo" style="background:#0b0d10; border:1px solid #23262d; borderRadius:8px; padding:10px 12px; color:#fff; fontSize:16px; fontWeight:700; outline:none">
        <div style="display:flex; gap:10px; justifyContent:flex-end; marginTop:4px">
          <button sc-camel-on-click="{{ closeExportModal }}" style="padding:10px 16px; borderRadius:8px; border:1px solid #23262d; background:#1c2027; color:#e7ebf1; fontSize:12px; fontWeight:800; cursor:pointer">CANCELAR</button>
          <button sc-camel-on-click="{{ confirmExportAll }}" style="padding:10px 16px; borderRadius:8px; border:none; background:#2563eb; color:#fff; fontSize:12px; fontWeight:800; cursor:pointer">DESCARGAR</button>
        </div>
      </div>
    </div>
  </sc-if>

  <aside style="width:296px; flexShrink:0; background:#eef1f6; borderRight:1px solid #d4dae4; padding:22px 20px 40px; overflowY:auto; display:flex; flexDirection:column; gap:22px">

    <div style="display:flex; flexDirection:column; gap:10px">
      <button sc-camel-on-click="{{ toggleStruct }}" style="display:flex; alignItems:center; justifyContent:space-between; background:none; border:none; padding:0; cursor:pointer">
        <div style="fontSize:10px; fontWeight:800; letterSpacing:0.18em; color:#8b95a6">ESTRUCTURA</div>
        <svg width="14" height="14" sc-camel-view-box="0 0 24 24" fill="none" stroke="#8b95a6" sc-camel-stroke-width="2.6" sc-camel-stroke-linecap="round" style="{{ structChevron }}"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <sc-if value="{{ structOpen }}" hint-placeholder-val="{{ true }}">
        <sc-for list="{{ pitches }}" as="p" hint-placeholder-count="4">
          <button sc-camel-on-click="{{ p.pick }}" style="{{ p.style }}">
            <span style="display:flex; width:16px; justifyContent:center">{{ p.icon }}</span>
            {{ p.label }}
          </button>
        </sc-for>
      </sc-if>
    </div>



    <div style="display:flex; flexDirection:column; gap:14px">
      <div style="display:flex; flexDirection:column; gap:8px">
        <div style="fontSize:11px; fontWeight:800; letterSpacing:0.16em; color:#e30613">JUGADORES</div>
        <div style="display:flex; gap:6px; flexWrap:wrap">
          <button sc-camel-on-click="{{ toggleDorsales }}" style="{{ dorsalStyle }}">{{ dorsalLabel }}</button>
          <button sc-camel-on-click="{{ toggleOrient }}" title="Mostrar semicírculo de orientación en cada jugador (arrástralo para girarlo)" style="{{ orientStyle }}">{{ orientLabel }}</button>
        </div>
      </div>
      <div style="display:flex; alignItems:center; justifyContent:space-between; marginTop:0">
        <div style="fontSize:9px; fontWeight:800; letterSpacing:0.1em; color:#8b95a6">COLORES</div>
        <button sc-camel-on-click="{{ addAllColor }}" title="Añadir los 11 al campo" style="fontSize:9px; fontWeight:800; letterSpacing:0.06em; color:#2563eb; background:none; border:none; cursor:pointer; padding:0">+ EQUIPO</button>
      </div>
      <div style="display:grid; gridTemplateColumns:repeat(6, 1fr); gap:9px">
        <sc-for list="{{ playersColor }}" as="pl" hint-placeholder-count="11">
          <button sc-camel-on-click="{{ pl.pick }}" title="{{ pl.title }}" style="{{ pl.style }}">{{ pl.num }}</button>
        </sc-for>
      </div>
      <div style="display:flex; alignItems:center; justifyContent:space-between; marginTop:2px">
        <div style="fontSize:9px; fontWeight:800; letterSpacing:0.1em; color:#8b95a6">ROJIBLANCO</div>
        <button sc-camel-on-click="{{ addAllAthletic }}" title="Añadir los 11 al campo" style="fontSize:9px; fontWeight:800; letterSpacing:0.06em; color:#e30613; background:none; border:none; cursor:pointer; padding:0">+ EQUIPO</button>
      </div>
      <div style="display:grid; gridTemplateColumns:repeat(6, 1fr); gap:9px">
        <sc-for list="{{ playersAthletic }}" as="pl" hint-placeholder-count="11">
          <button sc-camel-on-click="{{ pl.pick }}" title="{{ pl.title }}" style="{{ pl.style }}">{{ pl.num }}</button>
        </sc-for>
      </div>
    </div>

    <div style="display:flex; flexDirection:column; gap:12px">
      <div style="fontSize:10px; fontWeight:800; letterSpacing:0.18em; color:#8b95a6">CONOS</div>
      <div style="display:grid; gridTemplateColumns:repeat(4, 1fr); gap:9px">
        <sc-for list="{{ cones }}" as="c" hint-placeholder-count="4">
          <button sc-camel-on-click="{{ c.pick }}" title="{{ c.title }}" style="{{ c.style }}">
            <sc-if value="{{ c.isFlat }}" hint-placeholder-val="{{ false }}">
              <span style="width:20px; height:5px; borderRadius:2px; background:{{ c.color }}"></span>
            </sc-if>
            <sc-if value="{{ c.isCone }}" hint-placeholder-val="{{ true }}">
              <span style="width:0; height:0; borderLeft:9px solid transparent; borderRight:9px solid transparent; borderBottom:16px solid {{ c.color }}"></span>
            </sc-if>
            <span style="width:20px; height:3px; borderRadius:2px; background:#4b5563; marginTop:4px"></span>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="display:flex; flexDirection:column; gap:12px">
      <div style="fontSize:10px; fontWeight:800; letterSpacing:0.18em; color:#8b95a6">MATERIAL</div>
      <div style="display:grid; gridTemplateColumns:repeat(2, 1fr); gap:9px">
        <sc-for list="{{ material }}" as="m" hint-placeholder-count="6">
          <button sc-camel-on-click="{{ m.pick }}" style="{{ m.style }}">
            {{ m.icon }}
            <span style="fontSize:9px; fontWeight:800; letterSpacing:0.12em">{{ m.label }}</span>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="display:flex; flexDirection:column; gap:12px">
      <div style="fontSize:10px; fontWeight:800; letterSpacing:0.18em; color:#8b95a6">FLECHAS</div>
      <div style="display:flex; flexDirection:column; gap:9px">
        <sc-for list="{{ strokes }}" as="s" hint-placeholder-count="3">
          <button sc-camel-on-click="{{ s.pick }}" style="{{ s.style }}">
            <svg width="46" height="12" sc-camel-view-box="0 0 46 12" fill="none" stroke="currentColor" sc-camel-stroke-width="2" sc-camel-stroke-linecap="round">
              <path d="{{ s.preview }}" sc-camel-stroke-dasharray="{{ s.dash }}"></path>
              <path d="M38 2l6 4-6 4"></path>
            </svg>
            {{ s.label }}
          </button>
        </sc-for>
      </div>
    </div>
  </aside>

  <main style="flex:1; minWidth:0; display:flex; flexDirection:column; background:#07080a">

    <header style="display:flex; alignItems:center; flexWrap:wrap; gap:16px; padding:18px 26px; background:#0b0d10; borderBottom:1px solid #1b1f26">
      <div style="width:44px; height:44px; borderRadius:12px; background:#e30613; display:flex; alignItems:center; justifyContent:center; flexShrink:0">
        <svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="#0b0d10" sc-camel-stroke-width="2.4"><rect x="3" y="3" width="18" height="18" rx="3"></rect><path d="M3 12h18M12 3v18"></path></svg>
      </div>
      <div style="display:flex; flexDirection:column; gap:3px; minWidth:180px; flex:1 1 260px">
        <div style="fontSize:9px; fontWeight:800; letterSpacing:0.28em; color:#6b7482; whiteSpace:nowrap">ATHLETIC CLUB · DISEÑO TÁCTICO</div>
        <input value="{{ title }}" sc-camel-on-change="{{ setTitle }}" spellcheck="false" style="background:#14171c; border:1px solid #23262d; borderRadius:6px; padding:6px 12px; color:#fff; fontSize:26px; fontWeight:900; letterSpacing:-0.01em; textTransform:uppercase; width:100%; minWidth:0; outline:none; textOverflow:ellipsis">
      </div>
      <button sc-camel-on-click="{{ openNewModal }}" title="Nuevo ejercicio en blanco" style="padding:11px 18px; borderRadius:10px; border:1px solid #23262d; background:#14171c; color:#e7ebf1; fontSize:11px; fontWeight:800; letterSpacing:0.14em; cursor:pointer; flexShrink:0; whiteSpace:nowrap" style-hover="background:#1c2027">NUEVO</button>
      <button sc-camel-on-click="{{ saveExercise }}" style="padding:11px 18px; borderRadius:10px; border:none; background:#2563eb; color:#fff; fontSize:11px; fontWeight:800; letterSpacing:0.14em; cursor:pointer; flexShrink:0; whiteSpace:nowrap" style-hover="background:#1d4ed8">GUARDAR</button>
      <div style="marginLeft:auto; display:flex; alignItems:center; flexWrap:wrap; gap:10px; flexShrink:1; minWidth:0">
        <div style="fontSize:10px; fontWeight:800; letterSpacing:0.14em; color:#6b7482; whiteSpace:nowrap; flexShrink:0">{{ counterLabel }}</div>
        <div style="position:relative; flexShrink:0">
          <button sc-camel-on-click="{{ toggleSaved }}" style="padding:11px 18px; borderRadius:10px; border:1px solid #23262d; background:#14171c; color:#e7ebf1; fontSize:11px; fontWeight:800; letterSpacing:0.14em; cursor:pointer; whiteSpace:nowrap" style-hover="background:#1c2027">MIS EJERCICIOS</button>
          <sc-if value="{{ savedOpen }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute; top:calc(100% + 8px); right:0; width:280px; maxHeight:360px; overflowY:auto; background:#14171c; border:1px solid #23262d; borderRadius:12px; boxShadow:0 20px 40px rgba(0,0,0,0.5); zIndex:50; padding:8px">
              <sc-if value="{{ hasSaved }}" hint-placeholder-val="{{ false }}">
                <sc-for list="{{ savedItems }}" as="s" hint-placeholder-count="0">
                  <div style="display:flex; alignItems:center; gap:8px; padding:9px 10px; borderRadius:8px" style-hover="background:#1c2027">
                    <button sc-camel-on-click="{{ s.load }}" style="flex:1; minWidth:0; textAlign:left; background:none; border:none; color:#e7ebf1; fontSize:12px; fontWeight:700; cursor:pointer; whiteSpace:nowrap; overflow:hidden; textOverflow:ellipsis">{{ s.title }}</button>
                    <button sc-camel-on-click="{{ s.duplicate }}" title="Duplicar" style="width:24px; height:24px; borderRadius:6px; border:none; background:none; color:#6b7482; cursor:pointer; flexShrink:0" style-hover="color:#2563eb">
                      <svg width="13" height="13" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" sc-camel-stroke-width="2.2" sc-camel-stroke-linecap="round"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M4 16V6a2 2 0 0 1 2-2h10"></path></svg>
                    </button>
                    <button sc-camel-on-click="{{ s.remove }}" title="Eliminar" style="width:24px; height:24px; borderRadius:6px; border:none; background:none; color:#6b7482; cursor:pointer; flexShrink:0" style-hover="color:#f0343c">
                      <svg width="13" height="13" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" sc-camel-stroke-width="2.2" sc-camel-stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"></path></svg>
                    </button>
                  </div>
                </sc-for>
              </sc-if>
              <sc-if value="{{ noSaved }}" hint-placeholder-val="{{ true }}">
                <div style="padding:16px 10px; fontSize:11px; color:#6b7482; textAlign:center">Sin ejercicios guardados</div>
              </sc-if>
              <div style="display:flex; gap:6px; padding:8px 6px 4px; borderTop:1px solid #23262d; marginTop:4px">
                <button sc-camel-on-click="{{ exportAll }}" style="flex:1; padding:8px; borderRadius:7px; border:1px solid #23262d; background:#1c2027; color:#e7ebf1; fontSize:10px; fontWeight:800; letterSpacing:0.08em; cursor:pointer" style-hover="background:#2c323b">GUARDAR EJERCICIOS</button>
                <label style="flex:1; padding:8px; borderRadius:7px; border:1px solid #23262d; background:#1c2027; color:#e7ebf1; fontSize:10px; fontWeight:800; letterSpacing:0.08em; cursor:pointer; textAlign:center" style-hover="background:#2c323b">
                  IMPORTAR
                  <input type="file" accept="application/json" sc-camel-on-change="{{ importAll }}" style="display:none">
                </label>
              </div>
            </div>
          </sc-if>
        </div>
        <button sc-camel-on-click="{{ exportPng }}" style="padding:11px 18px; borderRadius:10px; border:1px solid #23262d; background:#14171c; color:#e7ebf1; fontSize:11px; fontWeight:800; letterSpacing:0.14em; cursor:pointer; flexShrink:0; whiteSpace:nowrap" style-hover="background:#1c2027">IMAGEN</button>
        <button sc-camel-on-click="{{ exportVideo }}" disabled="{{ videoDisabled }}" style="{{ videoBtnStyle }} flex-shrink:0; white-space:nowrap;">{{ videoBtnLabel }}</button>
        <button sc-camel-on-click="{{ toggleFullscreen }}" title="Pantalla completa" style="width:42px; height:42px; borderRadius:10px; border:1px solid #23262d; background:#14171c; color:#e7ebf1; display:flex; alignItems:center; justifyContent:center; cursor:pointer; flexShrink:0" style-hover="background:#1c2027">
          <svg width="17" height="17" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" sc-camel-stroke-width="2.3" sc-camel-stroke-linecap="round" sc-camel-stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"></path></svg>
        </button>
      </div>
    </header>

    <div style="display:flex; alignItems:center; gap:9px; padding:0 26px 14px; background:#0b0d10; borderBottom:1px solid #1b1f26">
      <button sc-camel-on-click="{{ toggle3d }}" title="Vista 3D del campo" style="{{ view3dBtnStyle }}">
        <svg width="15" height="15" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" sc-camel-stroke-width="2.2" sc-camel-stroke-linecap="round" sc-camel-stroke-linejoin="round"><path d="M12 2 3 7v10l9 5 9-5V7z"></path><path d="M3 7l9 5 9-5M12 12v10"></path></svg>
        VISTA 3D
      </button>
    </div>

    <div style="display:flex; alignItems:center; gap:9px; padding:14px 26px; background:#0b0d10; borderBottom:1px solid #1b1f26">
      <button sc-camel-on-click="{{ togglePlay }}" title="Reproducir animación" style="{{ playStyle }}">
        <sc-if value="{{ playing }}" hint-placeholder-val="{{ false }}">
          <svg width="15" height="15" sc-camel-view-box="0 0 24 24" fill="#062b17"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
        </sc-if>
        <sc-if value="{{ notPlaying }}" hint-placeholder-val="{{ true }}">
          <svg width="15" height="15" sc-camel-view-box="0 0 24 24" fill="#062b17"><path d="M8 5l11 7-11 7z"></path></svg>
        </sc-if>
      </button>
      <button sc-camel-on-click="{{ addFrame }}" title="Añadir fase" style="width:42px; height:42px; borderRadius:10px; border:none; background:#2563eb; color:#fff; display:flex; alignItems:center; justifyContent:center; cursor:pointer" style-hover="background:#1d4ed8">
        <svg width="17" height="17" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" sc-camel-stroke-width="3" sc-camel-stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
      <sc-raw-select value="{{ speed }}" sc-camel-on-change="{{ setSpeed }}" style="height:42px; padding:0 16px; borderRadius:10px; border:1px solid #23262d; background:#14171c; color:#e7ebf1; fontSize:14px; fontWeight:600; minWidth:190px; cursor:pointer">
        <option value="1600">Lento</option>
        <option value="1000">Normal</option>
        <option value="600">Rápido</option>
      </sc-raw-select>
      <div style="display:flex; alignItems:center; gap:7px">
        <sc-for list="{{ frames }}" as="f" hint-placeholder-count="1">
          <button sc-camel-on-click="{{ f.pick }}" title="{{ f.title }}" style="{{ f.style }}">{{ f.n }}</button>
        </sc-for>
      </div>
      <button sc-camel-on-click="{{ delFrame }}" title="Eliminar fase actual" style="width:42px; height:42px; borderRadius:10px; border:1px solid #23262d; background:#14171c; color:#9aa4b2; display:flex; alignItems:center; justifyContent:center; cursor:pointer" style-hover="background:#1c2027; color:#f0343c">
        <svg width="15" height="15" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" sc-camel-stroke-width="2.2" sc-camel-stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"></path></svg>
      </button>
      <button sc-camel-on-click="{{ clearAll }}" title="Limpiar" style="display:flex; alignItems:center; justifyContent:center; gap:8px; height:42px; padding:0 16px; borderRadius:10px; border:1px solid #23262d; background:#14171c; color:#f0343c; fontSize:11px; fontWeight:800; letterSpacing:0.14em; cursor:pointer" style-hover="background:#1c2027">
        <svg width="13" height="13" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" sc-camel-stroke-width="2.4" sc-camel-stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"></path></svg>
        LIMPIAR
      </button>
      <button sc-camel-on-click="{{ undo }}" title="Deshacer" style="display:flex; alignItems:center; justifyContent:center; gap:8px; height:42px; padding:0 16px; borderRadius:10px; border:1px solid #23262d; background:#14171c; color:#9aa4b2; fontSize:11px; fontWeight:800; letterSpacing:0.14em; cursor:pointer" style-hover="background:#1c2027; color:#fff">
        <svg width="13" height="13" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" sc-camel-stroke-width="2.4" sc-camel-stroke-linecap="round"><path d="M3 8h11a5 5 0 0 1 0 10H8M3 8l4-4M3 8l4 4"></path></svg>
        DESHACER
      </button>
      <div style="marginLeft:auto; fontSize:11px; fontWeight:700; letterSpacing:0.06em; color:#6b7482">{{ hint }}</div>
    </div>

    <div style="{{ fieldWrapStyle }}">
      <div ref="{{ fieldRef }}" sc-camel-on-pointer-down="{{ onDown }}" sc-camel-on-context-menu="{{ noMenu }}" style="{{ fieldStyle }}">

        <sc-if value="{{ showLines }}" hint-placeholder-val="{{ true }}">
          <svg sc-camel-view-box="{{ pitchBox }}" style="position:absolute; inset:0; width:100%; height:100%; pointerEvents:none" fill="none" stroke="{{ lineColor }}" sc-camel-stroke-width="4">
            <g transform="{{ pitchTransform }}">
              <path d="{{ pitchLines }}"></path>
              <circle cx="{{ spot1x }}" cy="{{ spot1y }}" r="6" fill="{{ lineColor }}" stroke="none"></circle>
              <circle cx="{{ spot2x }}" cy="{{ spot2y }}" r="6" fill="{{ lineColor }}" stroke="none"></circle>
            </g>
          </svg>
        </sc-if>

        <svg sc-camel-view-box="0 0 1000 1000" sc-camel-preserve-aspect-ratio="none" style="position:absolute; inset:0; width:100%; height:100%; pointerEvents:none; overflow:visible">
          <defs>
            <marker id="ar" sc-camel-view-box="0 0 10 10" sc-camel-ref-x="8" sc-camel-ref-y="5" sc-camel-marker-width="5" sc-camel-marker-height="5" orient="auto-start-reverse">
              <path d="M0,1 L9,5 L0,9 z" fill="#fff"></path>
            </marker>
          </defs>
          <sc-for list="{{ arrows }}" as="a" hint-placeholder-count="0">
            <path d="{{ a.d }}" stroke="{{ a.color }}" sc-camel-stroke-width="3.5" sc-camel-stroke-dasharray="{{ a.dash }}" sc-camel-stroke-linecap="round" sc-camel-marker-end="url(#ar)" sc-camel-vector-effect="non-scaling-stroke" fill="none"></path>
          </sc-for>
          <sc-if value="{{ hasDraft }}" hint-placeholder-val="{{ false }}">
            <path d="{{ draftD }}" stroke="rgba(255,255,255,0.65)" sc-camel-stroke-width="3.5" sc-camel-stroke-dasharray="6 8" sc-camel-stroke-linecap="round" sc-camel-vector-effect="non-scaling-stroke" fill="none"></path>
          </sc-if>
        </svg>

        <sc-for list="{{ items }}" as="it" hint-placeholder-count="0">
          <div sc-camel-on-pointer-down="{{ it.grab }}" sc-camel-on-double-click="{{ it.remove }}" title="{{ it.title }}" style="{{ it.box }}">
            <sc-if value="{{ it.isPlayer }}" hint-placeholder-val="{{ false }}">
              <span style="{{ it.chip }}">{{ it.label }}</span>
              <sc-if value="{{ it.showOrient }}" hint-placeholder-val="{{ false }}">
                <span style="{{ it.orientWrap }}"><span sc-camel-on-pointer-down="{{ it.startRotate }}" title="Arrastra para girar la orientación" style="{{ it.orientHalf }}"></span></span>
              </sc-if>
            </sc-if>
            <sc-if value="{{ it.isCone }}" hint-placeholder-val="{{ false }}">
              <span style="{{ it.tri }}"></span>
            </sc-if>
            <sc-if value="{{ it.isFlat }}" hint-placeholder-val="{{ false }}">
              <span style="{{ it.flat }}"></span>
            </sc-if>
            <sc-if value="{{ it.isBall }}" hint-placeholder-val="{{ false }}">
              <span style="width:100%; height:100%; borderRadius:50%; background:radial-gradient(circle at 35% 30%, #4b5563 45%, #0d1117 100%); border:0.18cqw solid #000; boxShadow:0 0.2cqw 0.5cqw rgba(0,0,0,0.45)"></span>
            </sc-if>
            <sc-if value="{{ it.isLadder }}" hint-placeholder-val="{{ false }}">
              <span style="width:100%; height:100%; border:0.22cqw solid #e5e7eb; borderRadius:0.3cqw; background:repeating-linear-gradient(90deg, transparent 0 1.1cqw, #e5e7eb 1.1cqw 1.32cqw)"></span>
            </sc-if>
            <sc-if value="{{ it.isHurdle }}" hint-placeholder-val="{{ false }}">
              <span style="width:100%; height:100%; borderTop:0.5cqw solid #f0343c; borderLeft:0.35cqw solid #f0343c; borderRight:0.35cqw solid #f0343c; borderRadius:0.3cqw 0.3cqw 0 0"></span>
            </sc-if>
            <sc-if value="{{ it.isGoal }}" hint-placeholder-val="{{ false }}">
              <span style="width:100%; height:100%; borderTop:0.4cqw solid #fff; borderLeft:0.4cqw solid #fff; borderRight:0.4cqw solid #fff; background:repeating-linear-gradient(90deg, rgba(255,255,255,0.5) 0 0.12cqw, transparent 0.12cqw 0.9cqw), repeating-linear-gradient(0deg, rgba(255,255,255,0.5) 0 0.12cqw, transparent 0.12cqw 0.9cqw)"></span>
            </sc-if>
            <sc-if value="{{ it.isZone }}" hint-placeholder-val="{{ false }}">
              <span style="width:100%; height:100%; border:0.3cqw dashed rgba(240,52,60,0.9); background:rgba(240,52,60,0.16); borderRadius:0.4cqw"></span>
            </sc-if>
            <sc-if value="{{ it.isPole }}" hint-placeholder-val="{{ false }}">
              <span style="width:100%; height:100%; background:linear-gradient(180deg,#facc15,#eab308); borderRadius:0.6cqw; boxShadow:0 0.2cqw 0.5cqw rgba(0,0,0,0.4)"></span>
            </sc-if>
            <sc-if value="{{ it.isRing }}" hint-placeholder-val="{{ false }}">
              <span style="width:100%; height:100%; borderRadius:50%; border:0.55cqw solid #f97316; boxSizing:border-box; boxShadow:0 0.2cqw 0.5cqw rgba(0,0,0,0.4)"></span>
            </sc-if>
            <sc-if value="{{ it.isMannequin }}" hint-placeholder-val="{{ false }}">
              <span style="display:block; width:100%; height:100%; background:radial-gradient(circle at 50% 14%, #e30613 0 22%, transparent 23%), linear-gradient(180deg, transparent 0 30%, #e30613 30% 100%); clipPath:polygon(30% 30%, 70% 30%, 88% 100%, 12% 100%, 30% 30%); boxShadow:0 0.2cqw 0.5cqw rgba(0,0,0,0.4)"></span>
            </sc-if>
            <sc-if value="{{ it.isMinigoal }}" hint-placeholder-val="{{ false }}">
              <span style="width:100%; height:100%; borderTop:0.4cqw solid #fff; borderLeft:0.4cqw solid #fff; borderRight:0.4cqw solid #fff; background:repeating-linear-gradient(90deg, rgba(255,255,255,0.5) 0 0.12cqw, transparent 0.12cqw 0.9cqw), repeating-linear-gradient(0deg, rgba(255,255,255,0.5) 0 0.12cqw, transparent 0.12cqw 0.9cqw); boxSizing:border-box"></span>
            </sc-if>
            <sc-if value="{{ it.isTallHurdle }}" hint-placeholder-val="{{ false }}">
              <span style="width:100%; height:100%; borderTop:0.5cqw solid #facc15; borderLeft:0.35cqw solid #facc15; borderRight:0.35cqw solid #facc15; borderRadius:0.3cqw 0.3cqw 0 0; boxSizing:border-box"></span>
            </sc-if>
            <sc-if value="{{ it.isSel }}" hint-placeholder-val="{{ false }}">
              <div sc-camel-on-pointer-down="{{ it.startResize }}" title="Arrastra para redimensionar" style="{{ it.hTL }}"></div>
              <div sc-camel-on-pointer-down="{{ it.startResize }}" title="Arrastra para redimensionar" style="{{ it.hTR }}"></div>
              <div sc-camel-on-pointer-down="{{ it.startResize }}" title="Arrastra para redimensionar" style="{{ it.hBL }}"></div>
              <div sc-camel-on-pointer-down="{{ it.startResize }}" title="Arrastra para redimensionar" style="{{ it.hBR }}"></div>
              <div sc-camel-on-pointer-down="{{ it.resizeY }}" title="Arrastra para cambiar la altura" style="{{ it.hT }}"></div>
              <div sc-camel-on-pointer-down="{{ it.resizeY }}" title="Arrastra para cambiar la altura" style="{{ it.hB }}"></div>
              <div sc-camel-on-pointer-down="{{ it.resizeX }}" title="Arrastra para cambiar el ancho" style="{{ it.hL }}"></div>
              <div sc-camel-on-pointer-down="{{ it.resizeX }}" title="Arrastra para cambiar el ancho" style="{{ it.hR }}"></div>
              <div sc-camel-on-pointer-down="{{ it.stop }}" style="position:absolute; bottom:100%; left:50%; transform:translate(-50%,-14px); display:flex; alignItems:center; gap:6px; padding:6px; borderRadius:12px; background:rgba(11,13,16,0.92); border:1px solid #2c323b; boxShadow:0 6px 16px rgba(0,0,0,0.45); zIndex:200; whiteSpace:nowrap">
                <button sc-camel-on-click="{{ it.smaller }}" title="Reducir" style="width:38px; height:38px; borderRadius:6px; border:none; background:#1c2027; color:#e7ebf1; fontSize:22px; fontWeight:900; lineHeight:1; cursor:pointer" style-hover="background:#2c323b">−</button>
                <span style="minWidth:52px; textAlign:center; fontSize:12px; fontWeight:800; letterSpacing:0.06em; color:#9aa4b2">{{ it.scaleLabel }}</span>
                <button sc-camel-on-click="{{ it.bigger }}" title="Aumentar" style="width:38px; height:38px; borderRadius:6px; border:none; background:#1c2027; color:#e7ebf1; fontSize:22px; fontWeight:900; lineHeight:1; cursor:pointer" style-hover="background:#2c323b">+</button>
                <span style="width:1px; height:26px; background:#2c323b; margin:0 2px"></span>
                <button sc-camel-on-click="{{ it.toggleLock }}" title="{{ it.lockLabel }}" style="width:38px; height:38px; borderRadius:6px; border:none; background:#1c2027; color:#e7ebf1; display:flex; alignItems:center; justifyContent:center; cursor:pointer" style-hover="background:#2c323b">
                  <sc-if value="{{ it.isLocked }}" hint-placeholder-val="{{ false }}">
                    <svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="#f0343c" sc-camel-stroke-width="2.4" sc-camel-stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="1.5"></rect><path d="M8 11V7a4 4 0 0 1 8 0v1"></path></svg>
                  </sc-if>
                  <sc-if value="{{ it.isUnlocked }}" hint-placeholder-val="{{ true }}">
                    <svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" sc-camel-stroke-width="2.4" sc-camel-stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="1.5"></rect><path d="M8 11V7a4 4 0 0 1 7-2.6"></path></svg>
                  </sc-if>
                </button>
                <span style="width:1px; height:26px; background:#2c323b; margin:0 2px"></span>
                <button sc-camel-on-click="{{ it.duplicateIt }}" title="Duplicar" style="width:38px; height:38px; borderRadius:6px; border:none; background:#1c2027; color:#e7ebf1; display:flex; alignItems:center; justifyContent:center; cursor:pointer" style-hover="background:#2c323b">
                  <svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" sc-camel-stroke-width="2.4" sc-camel-stroke-linecap="round"><rect x="8" y="8" width="20" height="20" rx="2"></rect><path d="M4 16V6a2 2 0 0 1 2-2h10"></path></svg>
                </button>
                <span style="width:1px; height:26px; background:#2c323b; margin:0 2px"></span>
                <button sc-camel-on-click="{{ it.sendBack }}" title="Enviar al fondo" style="width:38px; height:38px; borderRadius:6px; border:none; background:#1c2027; color:#e7ebf1; display:flex; alignItems:center; justifyContent:center; cursor:pointer" style-hover="background:#2c323b">
                  <svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" sc-camel-stroke-width="2.4" sc-camel-stroke-linecap="round"><path d="M12 20V10M7 15l5 5 5-5M5 4h14"></path></svg>
                </button>
                <button sc-camel-on-click="{{ it.sendBackward }}" title="Bajar una capa" style="width:38px; height:38px; borderRadius:6px; border:none; background:#1c2027; color:#e7ebf1; display:flex; alignItems:center; justifyContent:center; cursor:pointer" style-hover="background:#2c323b">
                  <svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" sc-camel-stroke-width="2.4" sc-camel-stroke-linecap="round"><path d="M12 5v11M7 12l5 5 5-5"></path></svg>
                </button>
                <button sc-camel-on-click="{{ it.bringForward }}" title="Subir una capa" style="width:38px; height:38px; borderRadius:6px; border:none; background:#1c2027; color:#e7ebf1; display:flex; alignItems:center; justifyContent:center; cursor:pointer" style-hover="background:#2c323b">
                  <svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" sc-camel-stroke-width="2.4" sc-camel-stroke-linecap="round"><path d="M12 19V8M7 13l5-5 5 5"></path></svg>
                </button>
                <button sc-camel-on-click="{{ it.bringFront }}" title="Traer al frente" style="width:38px; height:38px; borderRadius:6px; border:none; background:#1c2027; color:#e7ebf1; display:flex; alignItems:center; justifyContent:center; cursor:pointer" style-hover="background:#2c323b">
                  <svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" sc-camel-stroke-width="2.4" sc-camel-stroke-linecap="round"><path d="M12 4v10M7 9l5-5 5 5M5 20h14"></path></svg>
                </button>
                <span style="width:1px; height:26px; background:#2c323b; margin:0 2px"></span>
                <button sc-camel-on-click="{{ it.remove }}" title="Eliminar" style="width:38px; height:38px; borderRadius:6px; border:none; background:#1c2027; color:#f0343c; display:flex; alignItems:center; justifyContent:center; cursor:pointer" style-hover="background:#2c323b">
                  <svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" sc-camel-stroke-width="2.4" sc-camel-stroke-linecap="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"></path></svg>
                </button>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </div>
  </main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#e30613&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#e30613&quot;,&quot;#2563eb&quot;,&quot;#f59e0b&quot;,&quot;#22c55e&quot;],&quot;section&quot;:&quot;Marca&quot;},&quot;stripes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Campo&quot;}}">
const PC = ['#ef4444','#f97316','#f59e0b','#eab308','#84cc16','#22c55e','#2dd4bf','#38bdf8','#60a5fa','#a78bfa','#ec4899'];
const MAT = [
  { k: 'ball', label: 'BALÓN' }, { k: 'ladder', label: 'ESCALERA' },
  { k: 'hurdle', label: 'VALLA' }, { k: 'goal', label: 'PORTERÍA' },
  { k: 'zone', label: 'ZONA' }, { k: 'pole', label: 'PICA' },
  { k: 'ring', label: 'AROS' }, { k: 'mannequin', label: 'MANIQUÍ' },
  { k: 'minigoal', label: 'MINIPORTERÍA' }, { k: 'tallhurdle', label: 'VALLA ALTA' }
];
const SIZES = {
  player: [3.8, 3.8], cone: [3.2, 3.2], flat: [3, 1.2], ball: [2.3, 2.3],
  ladder: [13, 4.4], hurdle: [5, 3], goal: [11, 3.4], zone: [15, 11], pole: [1.3, 6],
  ring: [3.4, 3.4], mannequin: [2.4, 6], minigoal: [6, 2.6], tallhurdle: [5, 4.6]
};
const PITCHES = {
  total: { label: 'CAMPO TOTAL', box: '0 0 1050 680', ratio: 1050 / 680 },
  ataque: { label: 'ATAQUE', box: '0 0 680 525', ratio: 680 / 525 },
  defensa: { label: 'DEFENSA', box: '0 0 680 525', ratio: 680 / 525 },
  libre: { label: 'LIBRE', box: '0 0 1000 660', ratio: 1000 / 660 }
};

class Component extends DCLogic {
  state = {
    title: 'Nuevo ejercicio táctico',
    view3d: false,
    pitch: 'total',
    structOpen: true,
    savedOpen: false,
    saved: [],
    dorsales: true,
    orient: false,
    tool: { kind: 'player', num: 1 },
    frames: [{ items: [], arrows: [] }],
    cf: 0,
    speed: '1000',
    playing: false,
    anim: null,
    draft: null,
    sel: null
  };

  fieldRef = React.createRef();
  appRef = React.createRef();
  history = [];

  cur() { return this.state.frames[this.state.cf]; }
  view() { return this.state.playing && this.state.anim ? this.state.anim : this.cur(); }

  push() {
    this.history.push(JSON.stringify(this.state.frames));
    if (this.history.length > 40) this.history.shift();
  }

  mutate(fn) {
    this.push();
    this.setState(s => {
      const frames = s.frames.map((f, i) => i === s.cf ? { items: f.items.slice(), arrows: f.arrows.slice() } : f);
      fn(frames[s.cf]);
      return { frames };
    });
  }

  pct(e) {
    const r = this.fieldRef.current.getBoundingClientRect();
    return {
      x: Math.max(0, Math.min(100, ((e.clientX - r.left) / r.width) * 100)),
      y: Math.max(0, Math.min(100, ((e.clientY - r.top) / r.height) * 100))
    };
  }

  loadSavedList() {
    try { return JSON.parse(localStorage.getItem('tactics-exercises') || '[]'); } catch (e) { return []; }
  }
  writeSavedList(list) {
    localStorage.setItem('tactics-exercises', JSON.stringify(list));
    this.setState({ saved: list });
  }
  saveExercise = () => {
    const list = this.loadSavedList();
    const entry = { id: 'ex' + Date.now(), title: this.state.title || 'Ejercicio sin título', pitch: this.state.pitch, frames: this.state.frames, savedAt: new Date().toISOString() };
    this.writeSavedList([entry, ...list]);
  };
  loadExercise = id => {
    const e = this.loadSavedList().find(x => x.id === id);
    if (!e) return;
    this.setState({ title: e.title, pitch: e.pitch, frames: e.frames, cf: 0, sel: null, savedOpen: false, playing: false, anim: null });
  };
  deleteExercise = id => this.writeSavedList(this.loadSavedList().filter(x => x.id !== id));
  duplicateExercise = id => {
    const list = this.loadSavedList();
    const src = list.find(x => x.id === id);
    if (!src) return;
    const copy = Object.assign({}, src, { id: 'ex' + Date.now(), title: src.title + ' (copia)', savedAt: new Date().toISOString() });
    const idx = list.findIndex(x => x.id === id);
    const next = list.slice(); next.splice(idx + 1, 0, copy);
    this.writeSavedList(next);
  };
  openExportModal = () => this.setState({ exportModalOpen: true, exportNameDraft: 'ejercicios-tacticos' });
  closeExportModal = () => this.setState({ exportModalOpen: false });
  confirmExportAll = () => {
    const list = this.loadSavedList();
    let name = (this.state.exportNameDraft || '').trim() || 'ejercicios-tacticos';
    if (!name.toLowerCase().endsWith('.json')) name += '.json';
    const blob = new Blob([JSON.stringify(list, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    this.setState({ exportModalOpen: false });
  };
  importAll = e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const incoming = JSON.parse(reader.result);
        if (!Array.isArray(incoming)) return;
        const current = this.loadSavedList();
        const ids = new Set(current.map(x => x.id));
        const merged = current.concat(incoming.filter(x => !ids.has(x.id)));
        this.writeSavedList(merged);
      } catch (err) {}
    };
    reader.readAsText(file);
    e.target.value = '';
  };
  componentDidMount() {
    this.setState({ saved: this.loadSavedList() });
    this.mv = e => {
      if (this.rot) {
        const o = this.rot;
        const r = this.fieldRef.current.getBoundingClientRect();
        const cx = r.left + (o.x / 100) * r.width, cy = r.top + (o.y / 100) * r.height;
        let dir = Math.round(Math.atan2(e.clientX - cx, -(e.clientY - cy)) * 180 / Math.PI);
        if (!e.shiftKey) dir = Math.round(dir / 15) * 15;
        this.mutate(f => {
          const i = f.items.findIndex(x => x.id === o.id);
          if (i >= 0) f.items[i] = Object.assign({}, f.items[i], { dir: dir });
        });
        this.history.pop();
      } else if (this.rz) {
        const z = this.rz;
        const r = this.fieldRef.current.getBoundingClientRect();
        const cx = r.left + (z.x / 100) * r.width;
        const cy = r.top + (z.y / 100) * r.height;
        const cl = n => Math.max(0.35, Math.min(8, n));
        let patch;
        if (z.axis === 'x') patch = { sx: cl(z.s0x * (Math.abs(e.clientX - cx) / z.d0)) };
        else if (z.axis === 'y') patch = { sy: cl(z.s0y * (Math.abs(e.clientY - cy) / z.d0)) };
        else {
          const f2 = Math.hypot(e.clientX - cx, e.clientY - cy) / z.d0;
          patch = { sx: cl(z.s0x * f2), sy: cl(z.s0y * f2) };
        }
        this.mutate(f => {
          const i = f.items.findIndex(x => x.id === z.id);
          if (i >= 0) f.items[i] = Object.assign({}, f.items[i], patch);
        });
        this.history.pop();
      } else if (this.drag) {
        const p = this.pct(e);
        this.mutate(f => {
          const i = f.items.findIndex(x => x.id === this.drag);
          if (i >= 0) f.items[i] = Object.assign({}, f.items[i], p);
        });
        this.history.pop();
      } else if (this.state.draft) {
        const p = this.pct(e);
        this.setState(s => ({ draft: Object.assign({}, s.draft, { x2: p.x, y2: p.y }) }));
      }
    };
    this.up = () => {
      if (this.rot) { this.rot = null; return; }
      if (this.rz) { this.rz = null; return; }
      if (this.drag) { this.drag = null; return; }
      const d = this.state.draft;
      if (d) {
        this.setState({ draft: null });
        if (Math.hypot(d.x2 - d.x1, d.y2 - d.y1) > 2) this.mutate(f => f.arrows.push(Object.assign({ id: 'a' + Date.now() }, d)));
      }
    };
    this.kd = e => {
      if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) return;
      if (!this.state.sel) return;
      if (e.key === '+' || e.key === '=') { this.scale(this.state.sel, 1.15); e.preventDefault(); }
      else if (e.key === '-' || e.key === '_') { this.scale(this.state.sel, 1 / 1.15); e.preventDefault(); }
      else if (e.key === 'Delete' || e.key === 'Backspace') {
        const id = this.state.sel;
        if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
        this.mutate(f => { f.items = f.items.filter(x => x.id !== id); });
        this.setState({ sel: null });
      } else if (e.key === 'Escape') this.setState({ sel: null });
    };
    window.addEventListener('pointermove', this.mv);
    window.addEventListener('pointerup', this.up);
    window.addEventListener('keydown', this.kd);
  }
  exportPng = async () => {
    if (!window.html2canvas) return;
    const canvas = await window.html2canvas(this.fieldRef.current, { backgroundColor: null, scale: 2 });
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = (this.state.title || 'ejercicio') + '.png';
    a.click();
  };
  playOnce = () => new Promise(resolve => {
    this.togglePlay();
    const check = () => this.state.playing ? requestAnimationFrame(check) : resolve();
    requestAnimationFrame(check);
  });
  exportVideo = async () => {
    if (!window.html2canvas || this.state.recording || this.state.frames.length < 2) return;
    const field = this.fieldRef.current;
    const rect = field.getBoundingClientRect();
    const w = 1280, h = Math.round(w * (rect.height / rect.width));
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    const stream = canvas.captureStream(24);
    let mime = 'video/webm;codecs=vp9';
    if (window.MediaRecorder && MediaRecorder.isTypeSupported('video/mp4')) mime = 'video/mp4';
    else if (!window.MediaRecorder || !MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';
    const rec = new MediaRecorder(stream, { mimeType: mime });
    const chunks = [];
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    const stopped = new Promise(res => rec.onstop = res);
    this.setState({ recording: true });
    rec.start();
    let go = true;
    const drawLoop = async () => {
      if (!go) return;
      try {
        const shot = await window.html2canvas(field, { backgroundColor: null, scale: w / rect.width });
        ctx.clearRect(0, 0, w, h);
        ctx.drawImage(shot, 0, 0, w, h);
      } catch (e) {}
      if (go) requestAnimationFrame(drawLoop);
    };
    drawLoop();
    await this.playOnce();
    go = false;
    rec.stop();
    await stopped;
    const blob = new Blob(chunks, { type: mime });
    const ext = mime.indexOf('mp4') >= 0 ? 'mp4' : 'webm';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (this.state.title || 'ejercicio') + '.' + ext;
    a.click();
    this.setState({ recording: false });
  };
  beginResize(e, it, axis, kx, ky) {
    e.stopPropagation();
    const r = this.fieldRef.current.getBoundingClientRect();
    const cx = r.left + (it.x / 100) * r.width, cy = r.top + (it.y / 100) * r.height;
    const d0 = axis === 'x' ? Math.abs(e.clientX - cx)
      : axis === 'y' ? Math.abs(e.clientY - cy)
      : Math.hypot(e.clientX - cx, e.clientY - cy);
    this.push();
    this.rz = { id: it.id, x: it.x, y: it.y, axis: axis, s0x: kx, s0y: ky, d0: Math.max(5, d0) };
  }
  scale(id, k) {
    const cl = n => Math.max(0.35, Math.min(8, n));
    this.mutate(f => {
      const i = f.items.findIndex(x => x.id === id);
      if (i < 0) return;
      const it = f.items[i];
      f.items[i] = Object.assign({}, it, { sx: cl((it.sx || 1) * k), sy: cl((it.sy || 1) * k) });
    });
  }
  toggleFullscreen() {
    if (!document.fullscreenElement) {
      (this.appRef && this.appRef.current ? this.appRef.current : document.documentElement).requestFullscreen?.();
    } else {
      document.exitFullscreen?.();
    }
  }
  duplicate(it) {
    const copy = Object.assign({}, it, { id: it.kind + '-' + Date.now(), x: Math.min(97, it.x + 4), y: Math.min(97, it.y + 4) });
    this.mutate(f => f.items.push(copy));
    this.setState({ sel: copy.id });
  }
  reorder(id, dir) {
    this.mutate(f => {
      const i = f.items.findIndex(x => x.id === id);
      if (i < 0) return;
      const j = dir === 'front' ? f.items.length - 1 : dir === 'back' ? 0 : Math.max(0, Math.min(f.items.length - 1, i + dir));
      if (j === i) return;
      const [it] = f.items.splice(i, 1);
      f.items.splice(j, 0, it);
    });
  }
  componentWillUnmount() {
    window.removeEventListener('pointermove', this.mv);
    window.removeEventListener('pointerup', this.up);
    window.removeEventListener('keydown', this.kd);
    cancelAnimationFrame(this.raf);
  }

  onDown = e => {
    if (this.state.playing) return;
    const t = this.state.tool;
    const p = this.pct(e);
    if (this.state.sel) this.setState({ sel: null });
    if (!t) return;
    if (t.kind === 'stroke') { this.setState({ draft: { kind: t.line, color: '#fff', x1: p.x, y1: p.y, x2: p.x, y2: p.y } }); return; }
    if (t.kind === 'player') {
      const baseId = 'p-' + t.kit + '-' + t.num;
      const exists = this.cur().items.some(i => i.id === baseId);
      const id = exists ? baseId + '-' + Date.now() : baseId;
      this.mutate(f => f.items.push({ id: id, kind: 'player', num: t.num, kit: t.kit, x: p.x, y: p.y }));
      return;
    }
    this.mutate(f => f.items.push(Object.assign({ id: t.kind + Date.now(), x: p.x, y: p.y }, t)));
  };

  noMenu = e => e.preventDefault();

  arrowD(a) {
    const x1 = a.x1 * 10, y1 = a.y1 * 10, x2 = a.x2 * 10, y2 = a.y2 * 10;
    if (a.kind !== 'dribble') return 'M' + x1 + ',' + y1 + ' L' + x2 + ',' + y2;
    const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len, amp = 16;
    const segs = Math.max(3, Math.round(len / 55));
    let d = 'M' + x1 + ',' + y1;
    for (let i = 1; i <= segs; i++) {
      const t = i / segs, m = (i - 0.5) / segs, s = i % 2 ? 1 : -1;
      d += ' Q' + (x1 + dx * m + nx * amp * s) + ',' + (y1 + dy * m + ny * amp * s) + ' ' + (x1 + dx * t) + ',' + (y1 + dy * t);
    }
    return d;
  }

  togglePlay = () => {
    if (this.state.playing) { cancelAnimationFrame(this.raf); this.setState({ playing: false, anim: null }); return; }
    const fr = this.state.frames;
    if (fr.length < 2) return;
    const dur = Number(this.state.speed);
    const t0 = performance.now();
    this.setState({ playing: true, anim: fr[0] });
    const loop = () => {
      const el = performance.now() - t0;
      const total = dur * (fr.length - 1);
      if (el >= total) { this.setState({ playing: false, anim: null }); return; }
      const seg = Math.floor(el / dur);
      const raw = (el % dur) / dur;
      const t = raw < 0.5 ? 2 * raw * raw : 1 - Math.pow(-2 * raw + 2, 2) / 2;
      const A = fr[seg], B = fr[seg + 1];
      const items = A.items.map(a => {
        const b = B.items.find(x => x.id === a.id);
        return b ? Object.assign({}, a, { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }) : a;
      });
      this.setState({ anim: { items, arrows: B.arrows } });
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
  };

  renderVals() {
    const st = this.state;
    const v = this.view();
    const P = PITCHES[st.pitch];
    const accent = this.props.accent || '#e30613';
    const tool = st.tool;
    const stripes = this.props.stripes !== false;

    const btn = (on, extra) => 'display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:12px; font-size:11px; font-weight:800; letter-spacing:0.14em; cursor:pointer; text-align:left; ' +
      (on ? 'background:' + accent + '; color:#fff; border:2px solid #fff; box-shadow:0 4px 14px rgba(227,6,19,0.35);'
          : 'background:#14171c; color:#e7ebf1; border:1px solid #23262d;') + (extra || '');

    const pIcon = k => {
      const c = st.pitch === k ? '#fff' : accent;
      const paths = { total: 'M4 20L20 4M4 14v6h6M20 10V4h-6', ataque: 'M6 15l6-6 6 6', defensa: 'M6 9l6 6 6-6', libre: 'M6 6h12v12H6z' };
      return React.createElement('svg', { width: 14, height: 14, viewBox: '0 0 24 24', fill: 'none', stroke: c, strokeWidth: 2.6, strokeLinecap: 'round' },
        React.createElement('path', { d: paths[k] }));
    };

    const pitches = Object.keys(PITCHES).map(k => ({
      label: PITCHES[k].label, icon: pIcon(k), style: btn(st.pitch === k),
      pick: () => this.setState({ pitch: k })
    }));

    const kitBg = (n, kit) => kit === 'athletic' ? 'repeating-linear-gradient(90deg,#e30613 0 24%,#f4f4f4 24% 48%)' : PC[n - 1];
    const kitText = kit => kit === 'athletic' ? '#0f172a' : '#fff';
    const kitShadow = kit => kit === 'athletic' ? '0 1px 0 rgba(255,255,255,0.75)' : 'none';
    const kitBorder = kit => kit === 'athletic' ? '#7f1d1d' : 'rgba(255,255,255,0.75)';

    const usedId = (n, kit) => this.cur().items.some(i => i.id === 'p-' + kit + '-' + n);
    const makePlayers = kit => Array.from({ length: 11 }, (_, i) => {
      const n = i + 1, on = tool && tool.kind === 'player' && tool.num === n && tool.kit === kit, u = usedId(n, kit);
      return {
        num: n, title: u ? 'Jugador ' + n + ' (en campo)' : 'Colocar jugador ' + n,
        pick: () => this.setState({ tool: { kind: 'player', num: n, kit: kit } }),
        style: 'width:100%; aspect-ratio:1; border-radius:50%; background:' + kitBg(n, kit) + '; color:' + kitText(kit) + '; text-shadow:' + kitShadow(kit) + '; font-size:13px; font-weight:900; display:flex; align-items:center; justify-content:center; cursor:pointer; opacity:' + (u ? 0.3 : 1) + '; border:' + (on ? '3px solid #0b0d10' : '2px solid ' + kitBorder(kit)) + '; box-shadow:0 2px 6px rgba(15,23,42,0.25)'
      };
    });
    const playersColor = makePlayers('color');
    const playersAthletic = makePlayers('athletic');
    const FORMATION_LEFT = [[10,50],[25,20],[25,40],[25,60],[25,80],[45,15],[45,38],[45,62],[45,85],[65,35],[65,65]];
    const FORMATION_RIGHT = FORMATION_LEFT.map(([x,y]) => [100 - x, y]);
    const addAllTeam = (kit, side) => () => this.mutate(f => {
      const FORMATION = side === 'right' ? FORMATION_RIGHT : FORMATION_LEFT;
      for (let n = 1; n <= 11; n++) {
        const id = 'p-' + kit + '-' + n;
        if (f.items.some(x => x.id === id)) continue;
        const pos = FORMATION[n - 1];
        f.items.push({ id, kind: 'player', num: n, kit, x: pos[0], y: pos[1] });
      }
    });

    const coneDefs = [
      { kind: 'cone', color: '#ef4444', title: 'Cono rojo' },
      { kind: 'cone', color: '#3b82f6', title: 'Cono azul' },
      { kind: 'cone', color: '#22c55e', title: 'Cono verde' },
      { kind: 'flat', color: '#e5e7eb', title: 'Seta plana' }
    ];
    const cones = coneDefs.map(c => {
      const on = tool && tool.kind === c.kind && tool.color === c.color;
      return {
        color: c.color, title: c.title, isCone: c.kind === 'cone', isFlat: c.kind === 'flat',
        pick: () => this.setState({ tool: { kind: c.kind, color: c.color } }),
        style: 'display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding:10px 4px 8px; border-radius:12px; cursor:pointer; background:#2b3037; border:' + (on ? '2px solid ' + accent : '1px solid #3a4149')
      };
    });

    const matIcon = k => {
      const c = tool && tool.kind === k ? '#fff' : accent;
      const g = {
        ball: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7l3.5 2.5-1.3 4h-4.4l-1.3-4z',
        ladder: 'M4 6h16v12H4zM4 10h16M4 14h16',
        hurdle: 'M9 20V6h6v14M7 6h10',
        goal: 'M4 18V7h16v11M8 7v11M12 7v11M16 7v11',
        zone: 'M5 5h14v14H5z',
        pole: 'M12 4v16M8 20h8',
        ring: 'M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16z',
        mannequin: 'M12 3a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM8 11h8l-1 9H9z',
        minigoal: 'M5 17V8h14v9M9 8v9M15 8v9',
        tallhurdle: 'M8 20V5h8v15M6 5h12M8 12h8'
      };
      return React.createElement('svg', { width: 18, height: 18, viewBox: '0 0 24 24', fill: 'none', stroke: c, strokeWidth: 2, strokeLinecap: 'round' },
        React.createElement('path', { d: g[k] }));
    };
    const material = MAT.map(m => ({
      label: m.label, icon: matIcon(m.k),
      pick: () => this.setState({ tool: { kind: m.k } }),
      style: 'display:flex; flex-direction:column; align-items:center; gap:8px; padding:16px 8px; border-radius:12px; cursor:pointer; color:#e7ebf1; background:#14171c; border:' + (tool && tool.kind === m.k ? '2px solid ' + accent : '1px solid #23262d')
    }));

    const strokeDefs = [
      { line: 'run', label: 'CARRERA', dash: '5 5', preview: 'M3 6h34' },
      { line: 'pass', label: 'PASE', dash: '', preview: 'M3 6h34' },
      { line: 'dribble', label: 'CONDUCCIÓN', dash: '', preview: 'M3 6q5 -5 9 0t9 0t9 0t7 0' }
    ];
    const strokes = strokeDefs.map(s => ({
      label: s.label, dash: s.dash, preview: s.preview,
      pick: () => this.setState({ tool: { kind: 'stroke', line: s.line } }),
      style: btn(tool && tool.kind === 'stroke' && tool.line === s.line)
    }));

    const hBase = { position: 'absolute', background: '#fff', border: '2px solid ' + accent, boxShadow: '0 1px 4px rgba(0,0,0,0.5)', touchAction: 'none', zIndex: 10 };
    const handle = (sx, sy) => Object.assign({}, hBase, {
      width: 18, height: 18, borderRadius: 4,
      left: sx < 0 ? -10 : undefined, right: sx > 0 ? -10 : undefined,
      top: sy < 0 ? -10 : undefined, bottom: sy > 0 ? -10 : undefined,
      cursor: sx === sy ? 'nwse-resize' : 'nesw-resize'
    });
    const edge = side => {
      const horiz = side === 'l' || side === 'r';
      return Object.assign({}, hBase, {
        width: horiz ? 11 : 28, height: horiz ? 28 : 11, borderRadius: 5,
        left: side === 'l' ? -7 : (horiz ? undefined : '50%'),
        right: side === 'r' ? -7 : undefined,
        top: side === 't' ? -7 : (horiz ? '50%' : undefined),
        bottom: side === 'b' ? -7 : undefined,
        transform: horiz ? 'translateY(-50%)' : 'translateX(-50%)',
        cursor: horiz ? 'ew-resize' : 'ns-resize'
      });
    };

    const items = v.items.map((it, idx) => {
      const base = SIZES[it.kind] || [3, 3];
      const kx = it.sx || it.scale || 1, ky = it.sy || it.scale || 1;
      const k = Math.min(kx, ky);
      const sz = [base[0] * kx, base[1] * ky];
      const isSel = !st.playing && st.sel === it.id;
      return {
        isSel: isSel,
        isLocked: !!it.locked,
        isUnlocked: !it.locked,
        lockLabel: it.locked ? 'Desbloquear' : 'Bloquear posición',
        toggleLock: e => { e.stopPropagation(); this.mutate(f => { const t = f.items.find(x => x.id === it.id); if (t) t.locked = !t.locked; }); },
        duplicateIt: e => { e.stopPropagation(); this.duplicate(it); },
        sendBack: e => { e.stopPropagation(); this.reorder(it.id, 'back'); },
        sendBackward: e => { e.stopPropagation(); this.reorder(it.id, -1); },
        bringForward: e => { e.stopPropagation(); this.reorder(it.id, 1); },
        bringFront: e => { e.stopPropagation(); this.reorder(it.id, 'front'); },
        scaleLabel: Math.round(kx * 100) === Math.round(ky * 100)
          ? Math.round(kx * 100) + '%'
          : Math.round(kx * 100) + '×' + Math.round(ky * 100) + '%',
        stop: e => e.stopPropagation(),
        smaller: e => { e.stopPropagation(); this.scale(it.id, 1 / 1.15); },
        bigger: e => { e.stopPropagation(); this.scale(it.id, 1.15); },
        startResize: e => { if (it.locked) return; this.beginResize(e, it, 'both', kx, ky); },
        resizeX: e => { if (it.locked) return; this.beginResize(e, it, 'x', kx, ky); },
        resizeY: e => { if (it.locked) return; this.beginResize(e, it, 'y', kx, ky); },
        hTL: handle(-1, -1), hTR: handle(1, -1), hBL: handle(-1, 1), hBR: handle(1, 1),
        hT: edge('t'), hB: edge('b'), hL: edge('l'), hR: edge('r'),
        title: 'Clic para seleccionar y redimensionar · doble clic para eliminar',
        isPlayer: it.kind === 'player', isCone: it.kind === 'cone', isFlat: it.kind === 'flat',
        isBall: it.kind === 'ball', isLadder: it.kind === 'ladder', isHurdle: it.kind === 'hurdle',
        isGoal: it.kind === 'goal', isZone: it.kind === 'zone', isPole: it.kind === 'pole', isRing: it.kind === 'ring', isMannequin: it.kind === 'mannequin', isMinigoal: it.kind === 'minigoal', isTallHurdle: it.kind === 'tallhurdle',
        label: st.dorsales && it.kind === 'player' ? String(it.num) : '',
        showOrient: st.orient && it.kind === 'player',
        orientWrap: { position: 'absolute', inset: 0, pointerEvents: 'none', transform: 'rotate(' + (it.dir || 0) + 'deg)' },
        orientHalf: { position: 'absolute', left: '18%', width: '64%', top: '-34%', height: '34%', boxSizing: 'border-box', borderRadius: '999px 999px 0 0', background: '#fff', border: '0.2cqw solid #111827', borderBottom: 'none', pointerEvents: st.playing ? 'none' : 'auto', cursor: 'crosshair', touchAction: 'none' },
        startRotate: e => { if (st.playing || it.locked) return; e.stopPropagation(); this.push(); this.rot = { id: it.id, x: it.x, y: it.y }; this.setState({ sel: it.id }); },
        chip: { width: '100%', height: '100%', borderRadius: '50%', background: kitBg(it.num || 1, it.kit), color: kitText(it.kit), textShadow: kitShadow(it.kit), fontSize: (1.6 * k).toFixed(2) + 'cqw', fontWeight: 900, display: 'flex', alignItems: 'center', justifyContent: 'center', border: '0.22cqw solid ' + kitBorder(it.kit), boxShadow: '0 0.25cqw 0.6cqw rgba(0,0,0,0.45)' },
        tri: { width: 0, height: 0, borderLeft: sz[0] / 2 + 'cqw solid transparent', borderRight: sz[0] / 2 + 'cqw solid transparent', borderBottom: sz[1] + 'cqw solid ' + (it.color || '#ef4444'), filter: 'drop-shadow(0 0.2cqw 0.3cqw rgba(0,0,0,0.5))' },
        flat: { width: '100%', height: '100%', borderRadius: '50%', background: it.color || '#e5e7eb', opacity: 0.9 },
        box: {
          position: 'absolute', left: it.x + '%', top: it.y + '%', width: sz[0] + 'cqw', height: sz[1] + 'cqw',
          transform: 'translate(-50%,-50%)', display: 'flex', alignItems: 'center', justifyContent: 'center',
          cursor: st.playing ? 'default' : (it.locked ? 'not-allowed' : 'grab'), touchAction: 'none',
          zIndex: isSel ? 100 + idx : idx,
          outline: isSel ? '2px dashed rgba(255,255,255,0.9)' : 'none',
          outlineOffset: '3px', borderRadius: isSel ? '3px' : 0
        },
        grab: e => { if (st.playing) return; if (tool && tool.kind !== 'zone' && it.kind === 'zone') return; e.stopPropagation(); if (it.locked) { this.setState({ sel: it.id }); return; } this.drag = it.id; this.setState({ sel: it.id }); },
        remove: e => { e.stopPropagation(); if (it.locked) return; this.mutate(f => { f.items = f.items.filter(x => x.id !== it.id); }); }
      };
    });

    const arrows = v.arrows.map(a => ({
      d: this.arrowD(a),
      color: a.kind === 'pass' ? '#ffd166' : a.kind === 'dribble' ? '#7dd3fc' : '#ffffff',
      dash: a.kind === 'run' ? '18 14' : ''
    }));

    const frames = st.frames.map((f, i) => ({
      n: i + 1, title: 'Fase ' + (i + 1),
      pick: () => this.setState({ cf: i, playing: false, anim: null }),
      style: 'width:42px; height:42px; border-radius:10px; font-size:13px; font-weight:900; cursor:pointer; ' +
        (i === st.cf ? 'background:' + accent + '; color:#fff; border:none;' : 'background:#14171c; color:#9aa4b2; border:1px solid #23262d;')
    }));

    const toolName = !tool ? 'ninguna' : tool.kind === 'player' ? 'JUGADOR ' + tool.num
      : tool.kind === 'stroke' ? strokeDefs.find(s => s.line === tool.line).label
      : (MAT.find(m => m.k === tool.kind) || {}).label || (tool.kind === 'flat' ? 'SETA' : 'CONO');

    const lines = {
      total: 'M0,0 H1050 V680 H0 Z M525,0 V680 M0,138.4 H165 V541.6 H0 M0,248.4 H55 V431.6 H0 M1050,138.4 H885 V541.6 H1050 M1050,248.4 H995 V431.6 H1050 M-22,306 H0 M-22,306 V374 H0 M1072,306 H1050 M1072,306 V374 H1050 M433.5,340 A91.5,91.5 0 1 0 616.5,340 A91.5,91.5 0 1 0 433.5,340',
      half: 'M0,0 H680 V525 H0 Z M138.4,0 V165 H541.6 V0 M248.4,0 V55 H431.6 V0 M306,-22 H374 M306,-22 V0 M374,-22 V0 M275.5,165 A91.5,91.5 0 0 0 404.5,165'
    };

    return {
      title: st.title,
      setTitle: e => this.setState({ title: e.target.value }),
      structOpen: st.structOpen,
      toggleStruct: () => this.setState({ structOpen: !st.structOpen }),
      structChevron: { transform: st.structOpen ? 'rotate(0deg)' : 'rotate(-90deg)' },
      savedOpen: st.savedOpen,
      toggleSaved: () => this.setState({ savedOpen: !st.savedOpen }),
      hasSaved: st.saved.length > 0,
      noSaved: st.saved.length === 0,
      saveExercise: this.saveExercise,
      stopClick: e => e.stopPropagation(),
      newModalOpen: st.newModalOpen,
      newTitleDraft: st.newTitleDraft,
      setNewTitleDraft: e => this.setState({ newTitleDraft: e.target.value }),
      openNewModal: () => this.setState({ newModalOpen: true, newTitleDraft: 'Nuevo ejercicio táctico', sel: null }),
      closeNewModal: () => this.setState({ newModalOpen: false }),
      confirmNewExercise: () => this.setState({
        title: (st.newTitleDraft || '').trim() || 'Nuevo ejercicio táctico',
        frames: [{ items: [], arrows: [] }], cf: 0, sel: null, playing: false, anim: null, newModalOpen: false
      }),
      exportAll: this.openExportModal,
      importAll: this.importAll,
      exportModalOpen: st.exportModalOpen,
      exportNameDraft: st.exportNameDraft,
      setExportNameDraft: e => this.setState({ exportNameDraft: e.target.value }),
      closeExportModal: this.closeExportModal,
      confirmExportAll: this.confirmExportAll,
      savedItems: st.saved.map(s => ({
        title: s.title, load: () => this.loadExercise(s.id), remove: () => this.deleteExercise(s.id),
        duplicate: () => this.duplicateExercise(s.id)
      })),
      counterLabel: v.items.length + ' ELEMENTOS · ' + st.frames.length + ' FASES',
      hint: st.playing ? 'REPRODUCIENDO…'
        : st.sel ? 'SELECCIONADO · ESQUINAS = ESCALAR, LADOS = ANCHO/ALTO · − / + O TECLAS + Y − · SUPR PARA BORRAR'
        : 'HERRAMIENTA: ' + toolName + ' · CLIC PARA COLOCAR, ARRASTRA PARA MOVER O SELECCIONAR, DOBLE CLIC PARA BORRAR',
      pitches, playersColor, playersAthletic, cones, material, strokes, items, arrows, frames,
      addAllColor: addAllTeam('color', 'left'),
      addAllAthletic: addAllTeam('athletic', 'right'),
      dorsalLabel: st.dorsales ? '# DORSALES ON' : '# DORSALES OFF',
      dorsalStyle: 'padding:9px 12px; border-radius:999px; font-size:9px; font-weight:800; letter-spacing:0.1em; white-space:nowrap; cursor:pointer; border:1px solid ' + (st.dorsales ? 'rgba(227,6,19,0.35)' : '#cbd3e0') + '; background:' + (st.dorsales ? 'rgba(227,6,19,0.1)' : '#fff') + '; color:' + (st.dorsales ? accent : '#8b95a6'),
      toggleDorsales: () => this.setState({ dorsales: !st.dorsales }),
      orientLabel: st.orient ? '◐ ORIENTACIONES ON' : '◐ ORIENTACIONES OFF',
      orientStyle: 'padding:9px 12px; border-radius:999px; font-size:9px; font-weight:800; letter-spacing:0.1em; white-space:nowrap; cursor:pointer; border:1px solid ' + (st.orient ? 'rgba(227,6,19,0.35)' : '#cbd3e0') + '; background:' + (st.orient ? 'rgba(227,6,19,0.1)' : '#fff') + '; color:' + (st.orient ? '#e30613' : '#8b95a6'),
      toggleOrient: () => this.setState({ orient: !st.orient }),
      speed: st.speed,
      setSpeed: e => this.setState({ speed: e.target.value }),
      playing: st.playing, notPlaying: !st.playing,
      togglePlay: this.togglePlay,
      playStyle: 'width:42px; height:42px; border-radius:10px; border:none; cursor:' + (st.frames.length < 2 ? 'not-allowed' : 'pointer') + '; display:flex; align-items:center; justify-content:center; background:' + (st.frames.length < 2 ? '#1d4a33' : '#22c55e'),
      addFrame: () => this.setState(s => {
        const c = s.frames[s.cf];
        const copy = { items: c.items.map(i => Object.assign({}, i)), arrows: [] };
        const frames = s.frames.slice(); frames.splice(s.cf + 1, 0, copy);
        return { frames, cf: s.cf + 1, playing: false, anim: null };
      }),
      delFrame: () => this.setState(s => s.frames.length < 2 ? { frames: [{ items: [], arrows: [] }], cf: 0 }
        : { frames: s.frames.filter((f, i) => i !== s.cf), cf: Math.max(0, s.cf - 1) }),
      clearAll: () => { this.push(); this.setState({ frames: [{ items: [], arrows: [] }], cf: 0, playing: false, anim: null }); },
      undo: () => { const h = this.history.pop(); if (h) this.setState(s => { const frames = JSON.parse(h); return { frames, cf: Math.min(s.cf, frames.length - 1) }; }); },
      exportPng: this.exportPng,
      exportVideo: this.exportVideo,
      videoDisabled: st.frames.length < 2 || st.recording,
      videoBtnLabel: st.recording ? 'GRABANDO…' : 'VÍDEO',
      videoBtnStyle: 'padding:11px 18px; border-radius:10px; border:1px solid #23262d; background:' + (st.recording ? '#3a1420' : '#14171c') + '; color:' + (st.frames.length < 2 && !st.recording ? '#555b66' : '#e7ebf1') + '; font-size:11px; font-weight:800; letter-spacing:0.14em; cursor:' + (st.frames.length < 2 || st.recording ? 'not-allowed' : 'pointer'),
      fieldRef: this.fieldRef,
      appRef: this.appRef,
      toggleFullscreen: () => this.toggleFullscreen(),
      onDown: this.onDown, noMenu: this.noMenu,
      lineColor: 'rgba(255,255,255,0.5)',
      fieldWrapStyle: {
        flex: 1, minHeight: 0, margin: '22px 26px 26px', containerType: 'size', display: 'flex',
        alignItems: 'center', justifyContent: 'center', overflow: 'hidden',
        perspective: st.view3d ? '1400px' : 'none'
      },
      view3dBtnStyle: 'display:flex; align-items:center; gap:8px; padding:8px 14px; border-radius:8px; border:1px solid #23262d; background:' + (st.view3d ? '#2563eb' : '#14171c') + '; color:' + (st.view3d ? '#fff' : '#9aa4b2') + '; font-size:10px; font-weight:800; letter-spacing:0.12em; cursor:pointer',
      toggle3d: () => this.setState({ view3d: !st.view3d }),
      fieldStyle: {
        position: 'relative', containerType: 'size', flex: 'none',
        width: 'min(100cqw, ' + (100 * P.ratio).toFixed(3) + 'cqh)',
        height: 'min(100cqh, ' + (100 / P.ratio).toFixed(3) + 'cqw)',
        borderRadius: 14,
        background: stripes
          ? 'repeating-linear-gradient(180deg, rgba(255,255,255,0.045) 0 5%, rgba(0,0,0,0.05) 5% 10%), linear-gradient(180deg,#357a3b,#245227)'
          : 'linear-gradient(180deg,#2f6b34,#245227)',
        boxShadow: st.view3d
          ? 'inset 0 0 120px rgba(0,0,0,0.45), 0 40px 70px rgba(0,0,0,0.65)'
          : 'inset 0 0 120px rgba(0,0,0,0.45), 0 20px 50px rgba(0,0,0,0.5)',
        transform: st.view3d ? 'rotateX(42deg) scale(0.86) translateY(-6%)' : 'none',
        transformOrigin: '50% 50%',
        transition: 'transform 0.35s ease, box-shadow 0.35s ease',
        cursor: tool && tool.kind === 'stroke' ? 'crosshair' : 'copy', touchAction: 'none', overflow: 'hidden'
      },
      showLines: st.pitch !== 'libre',
      pitchBox: P.box,
      pitchTransform: st.pitch === 'defensa' ? 'translate(0,525) scale(1,-1)' : 'translate(0,0)',
      pitchLines: st.pitch === 'total' ? lines.total : lines.half,
      spot1x: st.pitch === 'total' ? 110 : 340, spot1y: st.pitch === 'total' ? 340 : 110,
      spot2x: st.pitch === 'total' ? 940 : 340, spot2y: st.pitch === 'total' ? 340 : 110,
      hasDraft: !!st.draft, draftD: st.draft ? this.arrowD(st.draft) : ''
    };
  }
}

</script>
